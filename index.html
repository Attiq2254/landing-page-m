<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خاص پیشکش - Exclusive Content</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px 20px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 15px;
        }
        .page-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .timer-msg {
            font-weight: bold;
            color: #d97706;
            margin-bottom: 15px;
            font-size: 15px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px 0;
            background-color: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        .btn.disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مطلوبہ لنک حاصل کرنے کے لیے نیچے دیے گئے بٹن پر کلک کریں</h1>
        
        <!-- 📸 آپ کی اپلوڈ کردہ تصویر -->
        <img src="img_778a0bce9046.jpg" alt="Landing Page Image" class="page-img"> 

        <p>آپ کا کنٹینٹ تیار ہے۔ آپ کو خود بخود ری ڈائریکٹ کیا جا رہا ہے...</p>

        <!-- ⏳ 2 سیکنڈ ٹائمر میسج -->
        <div id="timer-text" class="timer-msg">براہِ کرم 2 سیکنڈ انتظار کریں...</div>

        <!-- Adsterra Direct Link Button -->
        <a id="download-btn" href="https://www.profitableratecpmnetwork.com/tjyevk9a?key=721176469edc0e6e6cfffcb52d76fbb1" class="btn disabled" target="_blank" rel="noopener noreferrer">
            یہاں کلک کریں (Click Here)
        </a>
    </div>

    <script>
        const targetUrl = "https://www.profitableratecpmnetwork.com/tjyevk9a?key=721176469edc0e6e6cfffcb52d76fbb1";
        let timeLeft = 2;
        const timerText = document.getElementById('timer-text');
        const btn = document.getElementById('download-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerText.textContent = `براہِ کرم ${timeLeft} سیکنڈ انتظار کریں...`;
            } else {
                clearInterval(countdown);
                timerText.textContent = "آپ کو ری ڈائریکٹ کیا جا رہا ہے...";
                timerText.style.color = "#16a34a";
                btn.classList.remove('disabled');
                
                // 🚀 ٹائمر ختم ہوتے ہی خود بخود سائیڈ (Adsterra Direct Link) پر بھیج دے گا
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
